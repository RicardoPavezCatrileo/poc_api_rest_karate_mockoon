name: API Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MOCKOON_CLI_VERSION: "9.10.0"
  NEWMAN_VERSION: "6.2.3"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Validar el archivo de Mockoon
        run: npx --yes "@mockoon/cli@${MOCKOON_CLI_VERSION}" validate --data mocks/usuarios-api.json

      - name: Iniciar Mockoon CLI
        run: |
          nohup npx --yes "@mockoon/cli@${MOCKOON_CLI_VERSION}" start \
            --data mocks/usuarios-api.json --disable-log-to-file --log-transaction > mockoon.log 2>&1 &

      - name: Esperar a que la API esté disponible
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 60 --retry-delay 1 --retry-all-errors \
            http://localhost:3001/api/health

      # Si algún escenario falla, ApiTestRunner falla, Maven termina con error y el job queda en rojo
      - name: Ejecutar las pruebas Karate
        run: ./mvnw -B test "-Dkarate.env=ci"

      # Los pasos siguientes se ejecutan aunque falle Karate; el job igual termina en rojo
      - name: Ejecutar la colección de Postman con Newman
        if: ${{ !cancelled() }}
        run: >
          npx --yes "newman@${NEWMAN_VERSION}" run postman/usuarios-api.postman_collection.json
          -e postman/local.postman_environment.json
          -r cli,junit --reporter-junit-export target/newman/newman.xml

      - name: Ejecutar la prueba de carga con Gatling
        if: ${{ !cancelled() }}
        run: ./mvnw -B test-compile gatling:test "-Dperfil=carga" "-Dkarate.env=ci"

      # TPS, latencias, aserciones, recursos (MonitorRecursos) y hallazgos en el resumen del job
      - name: Resumir métricas de performance
        if: ${{ !cancelled() }}
        run: node scripts/resumen-performance.mjs

      - name: Publicar reportes y log de Mockoon
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: |
            target/karate-reports/
            target/karate.log
            target/gatling/
            target/gatling-recursos/
            target/newman/
            mockoon.log
          if-no-files-found: warn

  # Los mismos features contra los mocks en contenedores (compose.yaml): Mockoon y WireMock
  contenedores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Levantar Mockoon y WireMock con Docker Compose
        run: docker compose up -d

      - name: Esperar a que los mocks respondan
        run: |
          for url in http://localhost:3001/api/health http://localhost:8080/api/health; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 60 --retry-delay 1 --retry-all-errors "$url"
          done

      - name: Suite completa contra Mockoon en contenedor
        run: ./mvnw -B test "-Dkarate.env=ci"

      - name: Features de solo lectura contra WireMock
        if: ${{ !cancelled() }}
        run: >
          ./mvnw -B test "-Dkarate.env=ci" "-DbaseUrl=http://localhost:8080"
          "-Dkarate.options=classpath:health/health.feature classpath:usuarios/get-usuarios.feature classpath:auth/api-key.feature"

      - name: Guardar el log de los contenedores y detenerlos
        if: always()
        run: |
          docker compose logs --no-color > contenedores.log
          docker compose down

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-contenedores
          path: |
            target/karate-reports/
            target/karate.log
            contenedores.log
          if-no-files-found: warn
